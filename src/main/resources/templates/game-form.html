<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Adaugă/Editează Joc</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { max-width: 500px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;}
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
    .btn { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; text-decoration: none;}
    .btn-cancel { background-color: #f44336; padding: 9px 15px; margin-left: 10px; }
  </style>
</head>
<body>

<h2 th:text="${game.id} ? 'Editează Jocul' : 'Adaugă un Joc Nou'"></h2>

<form th:action="@{/games/save}" th:object="${game}" method="post">

  <input type="hidden" th:field="*{id}" />

  <div class="form-group">
    <label>Titlu Joc:</label>
    <input type="text" th:field="*{title}" required placeholder="Ex: FIFA 25" />
  </div>

  <div class="form-group">
    <label>Descriere scurtă:</label>
    <textarea th:field="*{description}" rows="3" placeholder="Detalii despre joc..."></textarea>
  </div>

  <div class="form-group">
    <label>Preț pe zi (RON):</label>
    <input type="number" step="0.1" th:field="*{dailyRentPrice}" required />
  </div>

  <div class="form-group">
    <label>Stoc disponibil (bucăți):</label>
    <input type="number" th:field="*{stock}" required />
  </div>

  <div class="form-group">
    <label>Platformă (Consolă):</label>
    <select th:field="*{console}">
      <option value="">-- Alege Platforma --</option>
      <option th:each="c : ${consoles}" th:value="${c.id}" th:text="${c.name}"></option>
    </select>
  </div>

  <div class="form-group">
    <label>Categorii (bifează una sau mai multe):</label>
    <div th:each="c : ${categories}" style="margin-bottom: 5px;">
      <input type="checkbox" th:field="*{categories}" th:value="${c.id}" />
      <label th:text="${c.name}" style="display:inline; font-weight:normal; margin-left: 5px;"></label>
    </div>
  </div>

  <button type="submit" class="btn">Salvează Jocul</button>
  <a th:href="@{/games}" class="btn btn-cancel">Anulează</a>
</form>

</body>
</html>
