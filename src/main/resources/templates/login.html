<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - GameRent</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-container { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="password"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    .btn:hover { background-color: #45a049; }
    .error-msg { color: red; text-align: center; margin-bottom: 15px; font-weight: bold; }
    .logout-msg { color: green; text-align: center; margin-bottom: 15px; font-weight: bold; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Autentificare</h2>

  <div th:if="${param.error}" class="error-msg">Username sau parolă incorecte!</div>
  <div th:if="${param.logout}" class="logout-msg">Te-ai deconectat cu succes!</div>

  <form th:action="@{/login}" method="post">
    <div class="form-group">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required autofocus />
    </div>

    <div class="form-group">
      <label for="password">Parolă:</label>
      <input type="password" id="password" name="password" required />
    </div>

    <button type="submit" class="btn">Intră în cont</button>
  </form>

  <div style="text-align: center; margin-top: 15px;">
    <a th:href="@{/users/new}" style="text-decoration: none; color: #2196F3;">Nu ai cont? Creează unul!</a>
  </div>
</div>

</body>
</html>
