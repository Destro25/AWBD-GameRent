<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adaugă/Editează Categorie</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { max-width: 400px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
        .btn { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; text-decoration: none;}
        .btn-cancel { background-color: #f44336; padding: 9px 15px; margin-left: 10px; }
    </style>
</head>
<body>

<h2 th:text="${category.id} ? 'Editează Categoria' : 'Adaugă o Categorie Nouă'"></h2>

<form th:action="@{/categories/save}" th:object="${category}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="form-group">
        <label>Nume Categorie:</label>
        <input type="text" th:field="*{name}" required placeholder="Ex: RPG, Shooter, Racing" />
    </div>

    <button type="submit" class="btn">Salvează Categoria</button>
    <a th:href="@{/categories}" class="btn btn-cancel">Anulează</a>
</form>

</body>
</html>
