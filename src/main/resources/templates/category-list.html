<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Lista Categorii</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .btn { padding: 5px 10px; text-decoration: none; color: white; border-radius: 3px; display: inline-block; margin-bottom: 10px;}
    .btn-add { background-color: #4CAF50; }
    .btn-edit { background-color: #2196F3; }
    .btn-delete { background-color: #f44336; }
    .nav-links { margin-bottom: 20px; background-color: #eee; padding: 10px; border-radius: 5px; }
    .nav-links a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
    .nav-links a:hover { color: #2196F3; }
  </style>
</head>
<body>

<div class="nav-links">
  <a th:href="@{/games}">Jocuri</a>
  <a th:href="@{/consoles}">Platforme</a>
  <a th:href="@{/categories}">Categorii</a>
</div>

<h2>Toate Categoriile</h2>

<a th:href="@{/categories/new}" class="btn btn-add">Adaugă Categorie Nouă</a>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Nume Categorie</th>
    <th>Acțiuni</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="category : ${categories}">
    <td th:text="${category.id}">1</td>
    <td th:text="${category.name}">Action</td>
    <td>
      <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-edit">Editează</a>
      <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/categories/delete/{id}(id=${category.id})}" class="btn btn-delete" onclick="return confirm('Ești sigur că vrei să ștergi această categorie?');">Șterge</a>
    </td>
  </tr>

  <tr th:if="${#lists.isEmpty(categories)}">
    <td colspan="3" style="text-align: center;">Nu există categorii înregistrate.</td>
  </tr>
  </tbody>
</table>

</body>
</html>
