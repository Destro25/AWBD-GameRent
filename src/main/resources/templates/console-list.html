<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista Platforme</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .btn { padding: 5px 10px; text-decoration: none; color: white; border-radius: 3px; display: inline-block; margin-bottom: 10px;}
    .btn-add { background-color: #4CAF50; }
    .btn-edit { background-color: #2196F3; }
    .btn-delete { background-color: #f44336; }
    .nav-links { margin-bottom: 20px; }
    .nav-links a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; border-bottom: 2px solid transparent; padding-bottom: 3px; }
    .nav-links a:hover { border-bottom: 2px solid #2196F3; }
  </style>
</head>
<body>

<div class="nav-links">
  <a th:href="@{/games}">Înapoi la Jocuri</a>
</div>

<h2>Toate Platformele (Consolele)</h2>

<a th:href="@{/consoles/new}" class="btn btn-add">Adaugă Platformă Nouă</a>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Nume Platformă</th>
    <th>Producător</th>
    <th>Acțiuni</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="console : ${consoles}">
    <td th:text="${console.id}">1</td>
    <td th:text="${console.name}">PlayStation 5</td>
    <td th:text="${console.manufacturer}">Sony</td>
    <td>
      <a th:href="@{/consoles/edit/{id}(id=${console.id})}" class="btn btn-edit">Editează</a>
      <a th:href="@{/consoles/delete/{id}(id=${console.id})}" class="btn btn-delete" onclick="return confirm('Ești sigur? Jocurile asociate cu această consolă și-ar putea pierde referința!');">Șterge</a>
    </td>
  </tr>

  <tr th:if="${#lists.isEmpty(consoles)}">
    <td colspan="4" style="text-align: center;">Nu există platforme înregistrate.</td>
  </tr>
  </tbody>
</table>

</body>
</html>
