<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Adaugă/Editează Utilizator</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { max-width: 600px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;}
    .form-section { border-bottom: 1px solid #ddd; margin-bottom: 15px; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
    .btn { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 3px; cursor: pointer; text-decoration: none;}
    .btn-cancel { background-color: #f44336; padding: 9px 15px; margin-left: 10px; }
  </style>
</head>
<body>

<h2 th:text="${user.id} ? 'Editează Utilizatorul' : 'Adaugă un Utilizator Nou'"></h2>

<form th:action="@{/users/save}" th:object="${user}" method="post">

  <input type="hidden" th:field="*{id}" />
  <input type="hidden" th:field="*{userProfile.id}" />

  <div class="form-section">
    <h3>Date de Conectare</h3>
    <div class="form-group">
      <label>Username:</label>
      <input type="text" th:field="*{username}" required />
    </div>
    <div class="form-group">
      <label>Email:</label>
      <input type="email" th:field="*{email}" required />
    </div>
    <div class="form-group">
      <label>Parolă:</label>
      <input type="password" th:field="*{password}" required />
    </div>
    <div class="form-group">
      <label>Cont Activ:</label>
      <input type="checkbox" th:field="*{enabled}" />
    </div>
  </div>

  <div class="form-section">
    <h3>Date Personale (Profil)</h3>
    <div class="form-group">
      <label>Prenume:</label>
      <input type="text" th:field="*{userProfile.firstName}" />
    </div>
    <div class="form-group">
      <label>Nume de Familie:</label>
      <input type="text" th:field="*{userProfile.lastName}" />
    </div>
    <div class="form-group">
      <label>Număr de Telefon:</label>
      <input type="text" th:field="*{userProfile.phoneNumber}" />
    </div>
    <div class="form-group">
      <label>Adresă:</label>
      <input type="text" th:field="*{userProfile.address}" />
    </div>
  </div>

  <button type="submit" class="btn">Salvează Utilizatorul</button>
  <a th:href="@{/users}" class="btn btn-cancel">Anulează</a>
</form>

</body>
</html>
